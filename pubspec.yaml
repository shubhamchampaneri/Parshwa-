name: parshwa_platinum_security
description: "Production Mobile App for Parshwa Platinum Apartment Security Management System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Backend & Realtime
  supabase_flutter: ^2.5.6

  # Navigation
  go_router: ^14.0.0

  # Security & Biometrics
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  crypto: ^3.0.3

  # Local Persistence & Offline Queue
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Camera, QR & Image Handling
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # Notifications & Realtime Alerts
  flutter_local_notifications: ^17.1.2
  audioplayers: ^6.0.0

  # Network & Device Utilities
  connectivity_plus: ^6.0.3
  share_plus: ^9.0.0
  csv: ^6.0.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
